<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title sets the page title shown by the browser. -->
    <title>Assignment 3 - Question 20</title>
    <!-- The charset defines the character encoding. -->
    <meta charset="UTF-8">
    <!-- The description summarizes the page for search engines. -->
    <meta name="description" content="A demonstration of important HTML head elements.">
    <!-- The author identifies the creator of the document. -->
    <meta name="author" content="Yash Tomar">
    <!-- The base tag sets the base URL used for relative links. -->
    <base href="https://example.com/">
    <!-- The link tag can reference a favicon or another external resource. -->
    <link rel="icon" href="data:,">
    <!-- The style tag contains CSS rules; it is intentionally empty as requested. -->
    <style></style>
    <!-- The script tag contains JavaScript; it is intentionally empty as requested. -->
    <script></script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates title, meta, base, link, style, and script elements.</p>
</body>
</html>
