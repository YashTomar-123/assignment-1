<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Question 8</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <form action="#" method="post">
        <label for="feedback">Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="6" cols="50" required></textarea>
        <br><br>
        <p>Rating:</p>
        <label><input type="radio" name="rating" value="Good" required> Good</label>
        <label><input type="radio" name="rating" value="Average"> Average</label>
        <label><input type="radio" name="rating" value="Poor"> Poor</label>
        <br><br>
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
