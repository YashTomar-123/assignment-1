<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Question 19</title>
</head>
<body>
    <h1>Form Security Attributes</h1>
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="message">Message:</label>
        <input type="text" id="message" name="message" required>
        <br><br>
        <button type="submit">Submit</button>
    </form>
    <p>Turning off autocomplete can reduce the chance that a browser automatically stores or fills sensitive form information on a shared device.</p>
</body>
</html>
