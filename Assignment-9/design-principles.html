<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive Principles</title><link rel="stylesheet" href="design-principles.css"></head><body><main><article><h2>Fluid Layouts</h2><p>Use flexible units so content can resize.</p><code>width: 100%;</code></article><article><h2>Flexible Media</h2><p>Images should fit their containers.</p><code>max-width: 100%;</code></article><article><h2>Breakpoints</h2><p>Change layout at suitable screen widths.</p><code>@media(max-width:600px)</code></article></main></body></html>
